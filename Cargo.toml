[package]
name = "git-vmr"
version = "0.10.0"
authors = ["Eugén Cowie"]
edition = "2024"
description = "Git CLI wrapper for interacting with multiple repositories as a single unified workspace"
homepage = "https://eugencowie.github.io/git-vmr"
repository = "https://github.com/eugencowie/git-vmr"
license = "GPL-2.0-only"
keywords = ["git", "vmr", "monorepo", "multi-repo", "polyrepo"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.10"
anyhow = "1.0.102"
aptabase-rs = "0.2.0"
axoupdater = "0.10.0"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
humantime = "2.3.0"
path-clean = "1.0.1"
pathdiff = "0.2.3"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.48.0", default-features = false, features = ["net", "rt", "time"] }
toml = "1.1.2"

[dev-dependencies]
assert_cmd = "2.1.1"
criterion = "0.8.2"
predicates = "3.1.3"
tempfile = "3.27.0"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
install-path = "CARGO_HOME"
install-updater = false
source-tarball = false
bin-aliases.git-vmr = ["vv"]
allow-dirty = ["ci"]

[[bench]]
name = "real_repos"
harness = false
