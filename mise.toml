[tools]
actionlint = "latest"
cargo-binstall = "latest"
cargo-dist = "latest"
"cargo:cargo-edit" = "latest"
"cargo:oranda" = "latest"
gh = "latest"
git-cliff = "latest"
node = "latest"
pandoc = "latest"
release-plz = "latest"
rust = ["stable", { version = "nightly", profile = "minimal", components = "rustfmt" }] # nightly for rustfmt.toml only
shellcheck = "latest"

[tasks.build]
description = "Build project"
run = "cargo build"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks.format]
description = "Fix formatting issues"
tools = { rust = "nightly" }
run = "cargo fmt"

[tasks.lint]
description = "Fix linting issues"
run = "cargo clippy --all-targets --fix --allow-dirty"

[tasks.check]
description = "Check formatting/linting/tests"
run = ["mise run format --check", "cargo clippy --all-targets", "cargo test"]

[tasks.changelog]
description = "Update changelog"
run = "git cliff --bump"

[tasks.release]
description = "Perform release process locally"
run = "release-plz update"

[tasks.dist]
description = "Plan distribution process"
run = "dist plan"

[tasks.site]
description = "Build website"
run = ["oranda build", "node .github/scripts/rewrite-install-commands.mjs"]

[tasks.serve]
description = "Build and serve website"
depends = ["site"]
run = "oranda serve"
