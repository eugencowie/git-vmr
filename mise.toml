[tools]
actionlint = "latest"
cargo-dist = "latest"
gh = "latest"
git-cliff = "latest"
node = "latest"
"npm:@fission-ai/openspec" = "latest"
release-plz = "latest"
rust = "nightly"

[tasks]
format = "cargo +nightly fmt"
lint = "cargo clippy --all-targets"
test = "cargo test"
changelog = "git cliff --bump"
release = "release-plz update"
dist = "dist plan"

[tasks.ci]
depends = ["format --check", "lint", "test"]
