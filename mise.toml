[tools]
actionlint = "latest"
cargo-binstall = "latest"
cargo-dist = "latest"
"cargo:oranda" = "latest"
gh = "latest"
git-cliff = "latest"
node = "latest"
"npm:@fission-ai/openspec" = "latest"
pandoc = "latest"
release-plz = "latest"
rust = "nightly"
shellcheck = "latest"

[tasks]
format = "cargo +nightly fmt"
lint = "cargo clippy --all-targets"
test = "cargo test"
changelog = "git cliff --bump"
release = "release-plz update"
dist = "dist plan"
site = ["oranda build", "node .github/scripts/rewrite-install-commands.mjs"]

[tasks.serve]
depends = ["site"]
run = "oranda serve"

[tasks.ci]
depends = ["format --check", "lint", "test"]
