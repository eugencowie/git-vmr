[tools]
cargo-dist = "0.33.0" # keep in sync with cargo-dist-version in Cargo.toml
gh = "latest"
git-cliff = "latest"
"github:axodotdev/oranda" = "latest"
jactionlint = "latest"
mr-boxington = "latest"
node = "latest"
pandoc = "latest"
release-plz = "latest"
rust = [
    # Tasks call mbx directly: with two rust entries, mise puts ~/.cargo/bin ahead
    # of its cargo wrapper inside tasks under `mise activate`, which bypasses mbx.
    { version = "stable", mr_boxington = true },
    { version = "nightly", profile = "minimal", components = "rustfmt" }, # nightly for rustfmt only
]
shellcheck = "latest"

[env]
RUSTFMT = "{{config_root}}/scripts/rustfmt-nightly.{% if os() == 'windows' %}cmd{% else %}sh{% endif %}"

[tasks.build]
description = "Build project"
run = "mbx build"

[tasks.test]
description = "Run tests"
run = "mbx test"

[tasks.format]
description = "Fix formatting issues"
run = "cargo fmt"

[tasks.lint]
description = "Fix linting issues"
run = "mbx clippy --all-targets --fix --allow-dirty"

[tasks.check]
description = "Check formatting/linting/tests"
depends = ["check:workflows"]
run = ["mise run format --check", "mbx clippy --all-targets", "mbx test"]

[tasks."check:workflows"]
hide = true
description = "Check GitHub Actions workflows"
run = "jactionlint"

[tasks.bench]
description = "Run benchmarks using real repositories (approx. 5 GB)"
run = "mbx bench --bench real_repos"

[tasks."bench:clean"]
description = "Remove real repositories benchmark fixture"
run = 'rm -rf "${GITVMR_BENCH_FIXTURE_DIR:-target/bench-fixtures/real-repos}"'

[tasks."release:prepare"]
description = "Update CHANGELOG.md and Cargo.toml to the next version"
shell = "bash -c"
run = [
  # Ignore commits off HEAD's first-parent chain (branch and upstream commits)
  "comm -23 <(git rev-list HEAD | sort) <(git rev-list --first-parent HEAD | sort) > .cliffignore",
  "git cliff --bump -o CHANGELOG.md",
  'version=$(git cliff --bumped-version) && release-plz set-version "${version#v}"',
]

[tasks."release:notes"]
hide = true
description = "Print a version's changelog section"
usage = 'arg "<version>" help="Version, without a leading v"'
quiet = true
run = '''
awk -v heading="## $usage_version" '
  $0 == heading {in_section=1; next}
  /^## / {in_section=0}
  in_section {print; if (NF) found=1}
  END {if (!found) {print "CHANGELOG.md has no " heading " section" > "/dev/stderr"; exit 1}}
' CHANGELOG.md
'''

[tasks.dist]
description = "Plan distribution process"
run = "dist plan"

[tasks.site]
description = "Build website"
run = ["oranda build", "node .github/scripts/rewrite-install-commands.mjs"]

[tasks.serve]
description = "Build and serve website"
depends = ["site"]
run = "oranda serve"

[tasks.man-to-md]
description = "Convert a git man page to docs/parity/<man-page>.md"
usage = 'arg "<man_page>" help="Man page to convert, e.g. git-add"'
run = 'scripts/man-to-md.sh "$usage_man_page" "docs/parity/$usage_man_page.md"'
