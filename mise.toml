[tools]
actionlint = "latest"
cargo-binstall = "latest"
cargo-dist = "latest"
"cargo:cargo-edit" = "latest"
"cargo:oranda" = "latest"
gh = "latest"
git-cliff = "latest"
node = "latest"
"npm:@fission-ai/openspec" = "latest"
"npm:skills" = "latest"
pandoc = "latest"
release-plz = "latest"
rust = "nightly"
shellcheck = "latest"

[tasks.init]
description = "Initialise development environment"
run = "skills experimental_install"

[tasks.build]
description = "Build project"
run = "cargo build"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks.format]
description = "Fix formatting issues"
run = "cargo +nightly fmt"

[tasks.lint]
description = "Fix linting issues"
run = "cargo clippy --all-targets --fix"

[tasks.check]
description = "Check formatting/linting/tests"
run = ["cargo +nightly fmt --check", "cargo clippy --all-targets", "cargo test"]

[tasks.changelog]
description = "Update changelog"
run = "git cliff --bump"

[tasks.release]
description = "Perform release process locally"
run = "release-plz update"

[tasks.dist]
description = "Plan distribution process"
run = "dist plan"

[tasks.site]
description = "Build website"
run = ["oranda build", "node .github/scripts/rewrite-install-commands.mjs"]

[tasks.serve]
description = "Build and serve website"
depends = ["site"]
run = "oranda serve"
