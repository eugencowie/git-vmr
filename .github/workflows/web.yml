# Workflow to build your docs with oranda (and mdbook)
# and deploy them to Github Pages
name: Web

# Only the deploy job pushes to GitHub Pages, so only it gets write permissions
permissions:
  contents: read

# What situations do we want to build docs in?
# All of these work independently and can be removed / commented out
# if you don't want oranda/mdbook running in that situation
on:
  # Check that a PR didn't break docs!
  #
  # Note that the "Deploy to Github Pages" step won't run in this mode,
  # so this won't have any side-effects. But it will tell you if a PR
  # completely broke oranda/mdbook. Sadly we don't provide previews (yet)!
  pull_request:

  # Whenever something gets pushed to main, update the docs!
  # This is great for getting docs changes live without cutting a full release.
  #
  # Note that if you're using cargo-dist, this will "race" the Release assets workflow
  # that actually builds the Github Release that oranda tries to read (and
  # this will almost certainly complete first). As a result you will publish
  # docs for the latest commit but the oranda landing page won't know about
  # the latest release. The workflow_run trigger below will properly wait for
  # cargo-dist, and so this half-published state will only last for ~10 minutes.
  #
  # If you only want docs to update with releases, disable this, or change it to
  # a "release" branch. You can, of course, also manually trigger a workflow run
  # when you want the docs to update.
  push:
    branches:
      - main

  # Whenever a workflow called "Release assets" completes, update the docs!
  #
  # If you're using cargo-dist, this is recommended, as it will ensure that
  # oranda always sees the latest release right when it's available. Note
  # however that Github's UI is wonky when you use workflow_run, and won't
  # show this workflow as part of any commit. You have to go to the "actions"
  # tab for your repo to see this one running (the gh-pages deploy will also
  # only show up there).
  #
  # Release assets also runs on pull requests, including those from forks. For a tag
  # push the run's branch is the tag, so the filter below keeps to release tags,
  # and the build job also skips any run that wasn't a push, as a branch can
  # share a tag's name. It reads nothing from the triggering run: it checks out
  # main and rebuilds from there.
  # jactionlint ignore=dangerous-triggers
  workflow_run:
    workflows: ["Release assets"]
    types:
      - completed
    branches:
      - '**[0-9]+.[0-9]+.[0-9]+*'

# Queue deploys rather than cancel them; a newer PR push cancels the older build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Stop `mise run` installing tools beyond what mise-action installed
  MISE_TASK_RUN_AUTO_INSTALL: false

# Alright, let's do it!
jobs:
  build:
    name: Build site and docs
    # Skip Release runs that weren't tag pushes (see workflow_run above)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Setup
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with: { install_args: rust cargo-binstall cargo:oranda node }

      # Run oranda and rewrite the homepage install commands
      #
      # This will write all output to ./target/public/
      - run: mise run site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/public

  deploy:
    name: Deploy site and docs
    needs: build
    # ONLY if we're on main (so no PRs or feature branches allowed!)
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    steps:
      # Deploy to GitHub Pages
      # The "target/public" dir that oranda made above will become the root dir
      # of this branch.
      #
      # Note that once the gh-pages branch exists, you must
      # go into repo's settings > pages and set "source: github-actions".
      # The other defaults work fine.
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
