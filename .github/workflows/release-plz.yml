name: Release-plz

on:
  push:
    branches:
      - develop

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'eugencowie' }}
    permissions:
      contents: write
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - &install-tools
        name: Install tools
        id: mise
        uses: jdx/mise-action@v5
        with:
          install_args: rust release-plz git-cliff
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          version: ${{ steps.mise.outputs.release-plz }}
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'eugencowie' }}
    permissions:
      pull-requests: write
      contents: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-tools
      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          version: v${{ steps.mise.outputs.git-cliff }}
          args: --bump
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: release-plz set-version "${RELEASE_VERSION#v}"
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          version: ${{ steps.mise.outputs.release-plz }}
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
